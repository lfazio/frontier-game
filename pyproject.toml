[project]
name = "frontier"
version = "0.1.0"
description = "Frontier: The Seldon Era — persistent multiplayer space strategy server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
]


[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "httpx>=0.28",
    "import-linter>=2.1",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontier"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Take time from ClockPort — ARCH ADR-6."
"datetime.datetime.utcnow".msg = "Take time from ClockPort — ARCH ADR-6."
"random.random".msg = "Take randomness from RngPort — ARCH ADR-6."
"random.randint".msg = "Take randomness from RngPort — ARCH ADR-6."

[tool.mypy]
python_version = "3.12"
packages = ["frontier"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["frontier.domain.*", "frontier.application.*"]
strict = true
disallow_any_explicit = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live database",
    "soak: long-running simulation, nightly rather than per-commit",
]

[tool.importlinter]
root_packages = ["frontier"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["frontier.domain"]
forbidden_modules = [
    "frontier.application", "frontier.adapters", "frontier.simulation", "frontier.config", "frontier.worldgen",
    "sqlalchemy", "fastapi", "redis", "httpx", "pydantic",
]

[[tool.importlinter.contracts]]
name = "Application does not know its adapters"
type = "forbidden"
source_modules = ["frontier.application"]
forbidden_modules = ["frontier.adapters", "sqlalchemy", "fastapi", "redis"]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "frontier.cli",
    "frontier.simulation",
    "frontier.adapters",
    "frontier.application",
    "frontier.worldgen",
    "frontier.domain",
]
