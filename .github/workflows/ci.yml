name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  JWT_SECRET: ci-secret-at-least-thirty-two-bytes-long
  DATABASE_URL: postgresql+asyncpg://frontier:frontier@localhost:5432/frontier
  REDIS_URL: redis://localhost:6379/0

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frontier
          POSTGRES_PASSWORD: frontier
          POSTGRES_DB: frontier
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U frontier" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Pinned so CI and developer machines resolve the same interpreter: a local 3.14
          # against a CI 3.12 is how an environment-dependent failure hides.
          python-version-file: .python-version
      - run: uv sync
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Types
        run: uv run mypy
      - name: Import boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -q -m "not integration"
      - name: Migrations and database tests
        run: uv run pytest -q -m "integration and not soak"
      - name: Anti-leak suite
        run: uv run pytest -q tests/antileak
